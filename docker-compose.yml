version: '3.8'

services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: gentan-minio
    command: server /data --console-address ":9001"
    ports:
      - "9010:9000" # S3 API endpoint (Port 9000 di host ditempati Portainer)
      - "9001:9001" # Web Console admin interface
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword # Ganti ini dengan password yang kuat saat deploy di VPS!
    volumes:
      - minio_data:/data
    restart: always

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gentan-storage-app
    ports:
      - "5000:5000" # Web Dashboard dan REST API
    environment:
      PORT: 5000
      JWT_SECRET: gentan-secret-key-123456 # Ganti ini dengan secret key yang kuat
      CORS_ORIGIN: "*"
      STORAGE_PROVIDER: minio
      S3_ENDPOINT: http://minio:9000 # Menggunakan hostname internal Docker network
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadminpassword # Harus sama dengan MINIO_ROOT_PASSWORD di atas
      S3_REGION: us-east-1
      S3_BUCKET_PREFIX: gentan-
      S3_FORCE_PATH_STYLE: "true"
      # Dasbor melaporkan kapasitas filesystem ini. Diarahkan ke volume MinIO
      # agar angka yang tampil adalah kapasitas penyimpanan objek yang sebenarnya.
      DISK_REPORT_PATH: /mnt/objectstore
    volumes:
      - ./backend/data:/app/backend/data # Menyimpan database SQLite secara persisten di host VPS
      - minio_data:/mnt/objectstore:ro # Hanya untuk membaca kapasitas disk (read-only)
    depends_on:
      - minio
    restart: always

volumes:
  minio_data:
    driver: local
